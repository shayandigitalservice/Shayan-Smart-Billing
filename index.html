<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Tapri Rush: Order Chaos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 800px;
            max-width: 100%;
            background: #16213e;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 2px solid #0f3460;
        }
        header {
            background: #0f3460;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 22px;
            color: #e94560;
            letter-spacing: 1px;
        }
        .stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        canvas {
            display: block;
            background: #1f4068;
            cursor: pointer;
        }
        .controls-bar {
            background: #0f3460;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>☕ Chai Tapri Rush</h1>
            <div class="stats">
                <div>Score: <span id="scoreVal">0</span></div>
                <div>Lives: <span id="livesVal">❤️ 3</span></div>
            </div>
        </header>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="controls-bar">
            <button class="btn" onclick="serveOrder('Adrak')">1. Adrak Chai</button>
            <button class="btn" onclick="serveOrder('Masala')">2. Masala Chai</button>
            <button class="btn" onclick="serveOrder('Lemon')">3. Lemon Chai</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;
        let gameActive = true;

        // Customer types & requirements
        const chaiTypes = ['Adrak', 'Masala', 'Lemon'];
        const colors = {
            'Adrak': '#ff9f43',
            'Masala': '#ee5253',
            'Lemon': '#0abde3'
        };

        let customers = [];
        let spawnTimer = 0;
        let spawnInterval = 120; // Frames between new customers

        class Customer {
            constructor(type) {
                this.type = type;
                this.x = 800;
                this.y = 250;
                this.speed = 1.5 + (score * 0.05); // Speed increases as score goes up
                this.patience = 100; // Max patience bar width
                this.maxPatience = 100;
            }

            update() {
                this.x -= this.speed;
                this.patience -= 0.35; // Patience drains over time
            }

            draw() {
                // Draw Customer Box/Avatar
                ctx.fillStyle = colors[this.type];
                ctx.fillRect(this.x, this.y - 40, 50, 60);

                // Customer head
                ctx.fillStyle = "#f1f2f6";
                ctx.beginPath();
                ctx.arc(this.x + 25, this.y - 55, 15, 0, Math.PI * 2);
                ctx.fill();

                // Order Bubble Text
                ctx.fillStyle = "#fff";
                ctx.font = "12px sans-serif";
                ctx.fillText(this.type + " Chai", this.x - 5, this.y - 80);

                // Patience Bar Background
                ctx.fillStyle = "#2d3436";
                ctx.fillRect(this.x - 10, this.y - 105, 70, 8);

                // Patience Bar Fill
                let barWidth = (this.patience / this.maxPatience) * 70;
                ctx.fillStyle = this.patience > 30 ? "#2ed573" : "#ff4757";
                ctx.fillRect(this.x - 10, this.y - 105, Math.max(0, barWidth), 8);
            }
        }

        function spawnCustomer() {
            let randomType = chaiTypes[Math.floor(Math.random() * chaiTypes.length)];
            customers.push(new Customer(randomType));
        }

        function serveOrder(chaiType) {
            if (!gameActive) return;

            // Check if the front customer matches the served tea type
            if (customers.length > 0) {
                let frontCustomer = customers[0];
                if (frontCustomer.type === chaiType) {
                    score += 10;
                    customers.shift(); // Remove served customer
                    document.getElementById("scoreVal").innerText = score;
                } else {
                    // Wrong order penalty
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) gameOver();
                }
            }
        }

        function updateLivesUI() {
            let hearts = "❤️ ".repeat(Math.max(0, lives));
            document.getElementById("livesVal").innerText = hearts;
        }

        function gameOver() {
            gameActive = false;
        }

        function resetGame() {
            score = 0;
            lives = 3;
            customers = [];
            gameActive = true;
            document.getElementById("scoreVal").innerText = score;
            updateLivesUI();
            loop();
        }

        function gameLoop() {
            if (!gameActive) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over! Tapri Bandh Ho Gayi 🛑", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "18px sans-serif";
                ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Click anywhere to restart", canvas.width / 2, canvas.height / 2 + 60);
                return;
            }

            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Tapri Counter Background
            ctx.fillStyle = "#2c2c54";
            ctx.fillRect(0, 270, 800, 130);
            ctx.fillStyle = "#40407a";
            ctx.fillRect(0, 260, 800, 15);

            // Handle Spawning
            spawnTimer++;
            if (spawnTimer >= Math.max(40, spawnInterval - (score * 2))) {
                spawnCustomer();
                spawnTimer = 0;
            }

            // Update & Draw Customers
            for (let i = customers.length - 1; i >= 0; i--) {
                let c = customers[i];
                c.update();
                c.draw();

                // If customer reaches the counter (x <= 100) or patience runs out
                if (c.x < 100 || c.patience <= 0) {
                    customers.splice(i, 1);
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Click to restart if game over
        canvas.addEventListener("click", () => {
            if (!gameActive) {
                resetGame();
            }
        });

        // Keyboard shortcuts: Keys 1, 2, 3
        window.addEventListener("keydown", (e) => {
            if (e.key === '1') serveOrder('Adrak');
            if (e.key === '2') serveOrder('Masala');
            if (e.key === '3') serveOrder('Lemon');
        });

        // Start the game
        gameLoop();
    </script>
</body>
</html>
