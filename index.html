<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayan Smart Billing - Ultra POS</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#4f46e5">

<style>
:root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #10b981;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

body { 
    background: var(--bg); 
    color: var(--text-main); 
    padding: 12px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}
.header h1 {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.5px;
}

.app-container {
    max-width: 900px;
    margin: auto;
    display: grid;
    gap: 16px;
}

.card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* Grid Form Layouts */
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    outline: none;
    background: #f8fafc;
    transition: 0.2s;
}

input:focus, select:focus {
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.btn {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
}
.btn:hover { background: var(--primary-hover); }
.btn-success { background: var(--success); }
.btn-warning { background: var(--warning); }
.btn-danger { background: var(--danger); }

/* Table Styling */
.table-responsive { overflow-x: auto; margin: 12px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #f1f5f9; text-align: left; padding: 10px; font-weight: 600; color: var(--text-muted); }
td { padding: 10px; border-bottom: 1px solid var(--border); }

/* Badge */
.badge {
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
}
.badge-danger { background: #fee2e2; color: #dc2626; }
.badge-success { background: #dcfce7; color: #16a34a; }

/* Grand Total Banner */
.total-banner {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #ffffff;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    margin: 12px 0;
}
.total-banner .amount {
    font-size: 26px;
    font-weight: 800;
    color: #38bdf8;
}

/* Printable Bill Area Optimization */
@media print {
    body * { visibility: hidden; }
    #printable-bill, #printable-bill * { visibility: visible; }
    #printable-bill { position: absolute; left: 0; top: 0; width: 80mm; font-size: 12px; }
}

@media (max-width: 600px) {
    .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
    <h1>⚡ Shayan Smart Billing POS</h1>
</div>

<div class="app-container">

    <!-- POS Section -->
    <div class="card">
        <div class="card-title">🧾 New Invoice Generator</div>
        
        <div class="form-grid-2" style="margin-bottom: 10px;">
            <input id="customer" placeholder="Customer Name / Mobile">
            <input id="barcodeInput" placeholder="🔍 Scan Barcode or Quick Search..." onkeypress="handleBarcode(event)">
        </div>

        <div class="form-grid-3" style="margin-bottom: 10px;">
            <select id="productSelect" onchange="autoFillPrice()"></select>
            <input id="qty" type="number" placeholder="Qty" value="1">
            <input id="price" type="number" placeholder="Price (₹)">
        </div>

        <button onclick="addItemToCart()" class="btn">+ Add Item to Bill</button>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th>Action</th></tr>
                </thead>
                <tbody id="cartBody"></tbody>
            </table>
        </div>

        <!-- Tax & Discounts -->
        <div class="form-grid-3">
            <input id="discFlat" type="number" placeholder="Discount (₹)" oninput="updateLiveTotal()">
            <input id="discPercent" type="number" placeholder="Discount (%)" oninput="updateLiveTotal()">
            <select id="gstRate" onchange="updateLiveTotal()">
                <option value="0">GST 0%</option>
                <option value="5">GST 5%</option>
                <option value="12">GST 12%</option>
                <option value="18">GST 18%</option>
            </select>
        </div>

        <div class="total-banner">
            <div style="font-size: 12px; opacity: 0.8;">Subtotal: ₹<span id="subTotalText">0.00</span> | GST: ₹<span id="gstText">0.00</span></div>
            <div class="amount">GRAND TOTAL: ₹<span id="grandTotalText">0.00</span></div>
        </div>

        <div class="form-grid-2" style="margin-bottom: 10px;">
            <input id="amtPaid" type="number" placeholder="Amount Paid">
            <select id="paymentMode">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
            </select>
        </div>

        <button onclick="generateInvoice()" class="btn btn-success">Generate & Print Bill</button>
    </div>

    <!-- Live Bill Receipt -->
    <div id="printable-bill" class="card" style="display:none;"></div>

</div>

<script>
let stock = JSON.parse(localStorage.getItem("stockDetails")) || {
    "Sample Item": { price: 100, qty: 20 }
};
let cart = [];

document.addEventListener("DOMContentLoaded", () => {
    loadProductDropdown();
});

function loadProductDropdown() {
    let select = document.getElementById("productSelect");
    select.innerHTML = `<option value="">Select Product...</option>`;
    for (let p in stock) {
        select.innerHTML += `<option value="${p}">${p} (Stock: ${stock[p].qty})</option>`;
    }
}

function autoFillPrice() {
    let p = document.getElementById("productSelect").value;
    if (stock[p]) {
        document.getElementById("price").value = stock[p].price;
    }
}

function handleBarcode(e) {
    if (e.key === 'Enter') {
        addItemToCart();
    }
}

function addItemToCart() {
    let p = document.getElementById("productSelect").value;
    let q = parseInt(document.getElementById("qty").value) || 0;
    let pr = parseFloat(document.getElementById("price").value) || 0;

    if (!p || q <= 0 || pr <= 0) return alert("Valid product, quantity aur price enter karein!");
    if (stock[p].qty < q) return alert("Stock me itni quantity nahi hai!");

    cart.push({ p, q, pr, total: q * pr });
    stock[p].qty -= q; // Deduct temporarily
    renderCart();
    document.getElementById("qty").value = 1;
}

function renderCart() {
    let tbody = document.getElementById("cartBody");
    tbody.innerHTML = "";
    cart.forEach((item, index) => {
        tbody.innerHTML += `
            <tr>
                <td><b>${item.p}</b></td>
                <td>${item.q}</td>
                <td>₹${item.pr}</td>
                <td>₹${item.total.toFixed(2)}</td>
                <td><button onclick="removeItem(${index})" class="btn btn-danger" style="padding:2px 6px; font-size:11px;">🗑</button></td>
            </tr>`;
    });
    updateLiveTotal();
}

function removeItem(index) {
    let item = cart[index];
    stock[item.p].qty += item.q; // Restore stock
    cart.splice(index, 1);
    renderCart();
    loadProductDropdown();
}

function updateLiveTotal() {
    let subtotal = cart.reduce((acc, curr) => acc + curr.total, 0);
    let flatDisc = parseFloat(document.getElementById("discFlat").value) || 0;
    let percentDisc = parseFloat(document.getElementById("discPercent").value) || 0;
    let discount = flatDisc + (subtotal * (percentDisc / 100));
    
    let taxable = Math.max(0, subtotal - discount);
    let gstRate = parseFloat(document.getElementById("gstRate").value) || 0;
    let gstAmount = taxable * (gstRate / 100);
    let grandTotal = taxable + gstAmount;

    document.getElementById("subTotalText").innerText = subtotal.toFixed(2);
    document.getElementById("gstText").innerText = gstAmount.toFixed(2);
    document.getElementById("grandTotalText").innerText = grandTotal.toFixed(2);
}

function generateInvoice() {
    if (cart.length === 0) return alert("Pehle cart me items add karein!");
    
    let billCard = document.getElementById("printable-bill");
    let grandTotal = document.getElementById("grandTotalText").innerText;
    let customer = document.getElementById("customer").value || "Walk-in";

    let billHTML = `
        <h3 style="text-align:center;">Shayan Store</h3>
        <p style="font-size:11px; text-align:center;">Customer: ${customer} | Date: ${new Date().toLocaleDateString()}</p>
        <hr style="margin:8px 0;">
        <table style="width:100%;">
            ${cart.map(i => `<tr><td>${i.p} x ${i.q}</td><td style="text-align:right;">₹${i.total}</td></tr>`).join('')}
        </table>
        <hr style="margin:8px 0;">
        <h4>Grand Total: ₹${grandTotal}</h4>
    `;

    billCard.innerHTML = billHTML;
    billCard.style.display = "block";
    
    // Save updated stock
    localStorage.setItem("stockDetails", JSON.stringify(stock));
    
    window.print();
}
</script>
</body>
</html>
